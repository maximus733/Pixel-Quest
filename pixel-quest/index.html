<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Quest — 8-bit Platformer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">A tiny retro platformer</p>
      <h1>PIXEL QUEST</h1>
      <p class="subtitle">Run, jump, collect stars, and find the flag.</p>
    </header>
    <section class="game-shell" aria-label="Game">
      <div class="hud">
        <span>★ <b id="score">000</b></span>
        <span>WORLD <b>1-1</b></span>
        <span>♥ <b id="lives">3</b></span>
      </div>
      <canvas id="game" width="960" height="540" aria-label="Pixel Quest game canvas"></canvas>
      <div class="message" id="message">PRESS ENTER TO START</div>
    </section>
    <div class="controls">
      <p><kbd>←</kbd> <kbd>→</kbd> Move <span>•</span> <kbd>Space</kbd> / <kbd>↑</kbd> Jump <span>•</span> <kbd>R</kbd> Restart</p>
      <div class="touch-controls">
        <button id="leftBtn" aria-label="Move left">◀</button>
        <button id="jumpBtn" aria-label="Jump">JUMP</button>
        <button id="rightBtn" aria-label="Move right">▶</button>
      </div>
    </div>
    <footer>Made with HTML Canvas • Original pixel art • Ready for GitHub Pages</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
